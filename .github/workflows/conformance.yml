# 계약을 잠근다 — contract/ 가 바뀌면 골든 벡터 200개가 지켜지는지 매번 본다.
# 그리고 비밀이 커밋에 섞이지 않았는지 본다 (docs/PROGRESS.md §7).
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: python -m pip install --upgrade pip numpy "pydantic>=2.0"

      - name: run_conformance
        run: python run_conformance.py
        working-directory: contract/conformance

      - name: mirror_check
        run: python mirror_check.py
        working-directory: contract/conformance

  # S2 파이프라인 + D5 지표 + D9 좌표 규약. GPU·네트워크·실자산을 쓰지 않으므로
  # CI 에서 그대로 돈다. D9 회귀 테스트가 여기서 축 순열 드리프트를 막는다.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: python -m pip install --upgrade pip -r server/requirements.txt
      - name: pytest
        run: python -m pytest server/tests/ -q

      # D27-b — 인계 꾸러미가 실제로 만들어지고 받는 쪽 검사를 통과하는지.
      # W11 에서 A5000 이 받은 판본은 sha256 은 맞고 API 는 없었다.
      - name: handoff pack + verify
        run: |
          python -m server.handoff.pack --out /tmp/handoff-ci
          cd /tmp/handoff-ci && PYTHONPATH=$GITHUB_WORKSPACE/contract/python python verify.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
